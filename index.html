<style>

.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e6eef7}.tag.open{background:#e8f6f3;color:var(--ok)}.tag.progress{background:#fff2d9;color:#8a5a00}.tag.delivered{background:#e5eefc;color:var(--pri)}.tag.done{background:#e8f6f3;color:var(--ok)}

@media(max-width:800px){.side{position:static;width:auto}.side nav{display:flex;flex-wrap:wrap;gap:4px}.lab{display:none}.main{margin-left:0}.wrap{padding:16px}.top{padding:0 16px}.sheet{grid-template-columns:1fr}.tb{border-left:0;border-top:2px solid var(--nav)}.sheet h1{font-size:34px}.sheet .l{padding:22px}.f{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside class="side"><div class="logo"><i>M</i>MechMind AI</div><nav id="nav"></nav></aside>
<div class="main"><header class="top"><span id="proj" class="mut"></span><span id="user"></span></header><main class="wrap" id="app"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),FEE=.2,LAST={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={users:[],jobs:[],projects:[],session:null,active:{}},preset=0;
try{S={...S,...JSON.parse(localStorage.getItem('mm2')||'{}')}}catch(e){}

const me=()=>S.users.find(u=>u.id===S.session),owner=()=>S.session||'guest',mine=()=>S.projects.filter(p=>p.owner===owner());
const uid=()=>Math.random().toString(36).slice(2,9),$m=n=>'$'+n.toFixed(2);
const N=n=>typeof n==='string'?n:(Math.abs(n)>=1e6||(n!==0&&Math.abs(n)<1e-3))?n.toExponential(3):String(+n.toPrecision(5));
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2400)}
const CAT={ht:['Heat transfer','Conduction, fins, lumped systems, convection, radiation, heat exchangers'],hv:['HVAC and psychrometrics','Air loads, ventilation, ducts, moist air, refrigeration cycle'],th:['Thermodynamics','Ideal gas, Carnot limits, cycle performance'],fl:['Fluid mechanics','Pipe flow, friction losses, pump power'],st:['Statics','Beam reactions, moments and deflection'],dy:['Dynamics and vibration','Natural frequency, damping, torque and power'],ma:['Materials and strength','Stress, safety factor, strain, buckling'],md:['Machine design','Shaft sizing and power transmission']};
const T=(c,id,t,i,f)=>[c,id,t,i,f];
const K=[
T('ht','wall','Composite wall with convection',[['hi','Inside h (W/m²K)',8],['L1','Layer 1 thickness (mm)',200],['k1','Layer 1 k (W/mK)',.8],['L2','Layer 2 thickness (mm)',50],['k2','Layer 2 k (W/mK)',.04],['ho','Outside h (W/m²K)',25],['A','Area (m²)',10],['dT','Temperature difference (K)',20]],v=>{const R=1/v.hi+v.L1/1e3/v.k1+v.L2/1e3/v.k2+1/v.ho;return[['U-value',1/R,'W/m²K'],['Total resistance',R,'m²K/W'],['Heat flow',v.A*v.dT/R,'W']]}),
T('ht','cyl','Cylinder conduction and critical radius',[['k','k (W/mK)',.04],['L','Length (m)',10],['r1','Inner radius (mm)',20],['r2','Outer radius (mm)',40],['T1','Inner temp (°C)',90],['T2','Outer temp (°C)',30],['h','Outside h (W/m²K)',10]],v=>[['Heat flow',2*Math.PI*v.L*v.k*(v.T1-v.T2)/Math.log(v.r2/v.r1),'W'],['Critical radius k/h',v.k/v.h*1e3,'mm']]),
T('ht','fin','Pin fin with corrected length',[['h','h (W/m²K)',25],['k','k (W/mK)',200],['D','Diameter (mm)',10],['L','Length (mm)',100],['Tb','Base temp (°C)',100],['Ti','Fluid temp (°C)',25]],v=>{const P=Math.PI*v.D/1e3,Ac=Math.PI*(v.D/1e3)**2/4,m=Math.sqrt(v.h*P/(v.k*Ac)),mL=m*(v.L+v.D/4)/1e3,th=Math.tanh(mL);return[['Fin heat rate',Math.sqrt(v.h*P*v.k*Ac)*(v.Tb-v.Ti)*th,'W'],['Efficiency',th/mL*100,'%'],['m',m,'1/m']]}),
T('ht','lump','Lumped capacitance (sphere)',[['D','Diameter (mm)',20],['rho','Density (kg/m³)',7800],['cp','cp (J/kgK)',480],['k','k (W/mK)',45],['h','h (W/m²K)',100],['Ti','Initial temp (°C)',500],['Tf','Fluid temp (°C)',25],['t','Time (s)',60]],v=>{const Lc=v.D/6e3,Bi=v.h*Lc/v.k,tau=v.rho*v.cp*Lc/v.h;return[['Biot number',Bi,''],['Lumped valid',Bi<.1?'Yes, Bi below 0.1':'No, use transient charts',''],['Time constant',tau,'s'],['Temperature at t',v.Tf+(v.Ti-v.Tf)*Math.exp(-v.t/tau),'°C']]}),
T('ht','rad','Convection and radiation from a surface',[['h','h (W/m²K)',10],['e','Emissivity',.9],['A','Area (m²)',2],['Ts','Surface temp (°C)',80],['Ti','Air temp (°C)',20],['Tr','Surroundings (°C)',20]],v=>{const c=v.h*v.A*(v.Ts-v.Ti),r=v.e*5.67e-8*v.A*((v.Ts+273.15)**4-(v.Tr+273.15)**4);return[['Convection',c,'W'],['Radiation',r,'W'],['Total',c+r,'W']]}),
T('ht','lmtd','Heat exchanger area (LMTD, counterflow)',[['Thi','Hot in (°C)',90],['Tho','Hot out (°C)',60],['Tci','Cold in (°C)',20],['Tco','Cold out (°C)',50],['Q','Duty (kW)',100],['U','U (W/m²K)',500],['F','Correction factor F',1]],v=>{const a=v.Thi-v.Tco,b=v.Tho-v.Tci;if(a<=0||b<=0)return'Temperatures cross; check the terminal differences.';const lm=Math.abs(a-b)<1e-9?a:(a-b)/Math.log(a/b);return[['LMTD',lm,'K'],['Required area',v.Q*1e3/(v.U*v.F*lm),'m²']]}),
T('ht','nat','Natural convection, vertical plate in air',[['L','Height (m)',.5],['Ts','Surface temp (°C)',60],['Ti','Air temp (°C)',20],['A','Area (m²)',.5]],v=>{const nu=1.6e-5,al=2.25e-5,k=.026,Pr=nu/al,b=1/((v.Ts+v.Ti)/2+273.15),Ra=9.81*b*Math.abs(v.Ts-v.Ti)*v.L**3/(nu*al),Nu=(.825+.387*Ra**(1/6)/(1+(.492/Pr)**(9/16))**(8/27))**2,h=Nu*k/v.L;return[['Rayleigh',Ra,''],['Nusselt',Nu,''],['h',h,'W/m²K'],['Heat rate',h*v.A*(v.Ts-v.Ti),'W']]}),
T('hv','air','Air sensible capacity',[['Q','Airflow (m³/h)',3000],['rho','Density (kg/m³)',1.2],['cp','cp (kJ/kgK)',1.006],['dT','Temperature difference (K)',10]],v=>{const k=v.rho*v.Q/3600*v.cp*v.dT;return[['Capacity',k,'kW'],['Capacity',k/3.517,'TR']]}),
T('hv','vent','Outdoor air requirement',[['n','Occupants',30],['A','Floor area (m²)',250],['rp','Per person (L/s)',10],['ra','Per area (L/s·m²)',.3]],v=>{const t=v.n*v.rp+v.A*v.ra;return[['Outdoor air',t,'L/s'],['Outdoor air',t*3.6,'m³/h']]}),
T('hv','duct','Duct sizing',[['Q','Airflow (m³/h)',2500],['v','Velocity (m/s)',5],['r','Width/height ratio',2]],v=>{const A=v.Q/3600/v.v,h=Math.sqrt(A/v.r)*1e3;return[['Area',A,'m²'],['Round diameter',Math.sqrt(4*A/Math.PI)*1e3,'mm'],['Rectangular height',h,'mm'],['Rectangular width',h*v.r,'mm']]}),
T('hv','psy','Moist air properties',[['t','Dry-bulb (°C)',25],['rh','Relative humidity (%)',50],['p','Pressure (kPa)',101.325]],v=>{const pw=.61121*Math.exp((18.678-v.t/234.5)*(v.t/(257.14+v.t))),pv=v.rh/100*pw;if(pv>=v.p||v.rh<=0)return'Check humidity and pressure.';const w=.621945*pv/(v.p-pv),a=Math.log(pv/.61121);return[['Humidity ratio',w*1e3,'g/kg'],['Enthalpy',1.006*v.t+w*(2501+1.86*v.t),'kJ/kg'],['Dew point',257.14*a/(18.678-a),'°C'],['Vapor pressure',pv,'kPa']]}),
T('hv','cop','Refrigeration cycle COP',[['h1','Evaporator outlet h1 (kJ/kg)',400],['h2','Compressor outlet h2 (kJ/kg)',442],['h4','Expansion outlet h4 (kJ/kg)',250],['m','Mass flow (kg/s)',.5]],v=>v.h2<=v.h1||v.h4>=v.h1?'Require h2 > h1 > h4.':[['COP',(v.h1-v.h4)/(v.h2-v.h1),''],['Cooling capacity',v.m*(v.h1-v.h4),'kW'],['Compressor power',v.m*(v.h2-v.h1),'kW']]),
T('th','gas','Ideal gas mass and density',[['P','Pressure (kPa)',101.325],['V','Volume (m³)',1],['t','Temperature (°C)',25],['R','R (kJ/kgK)',.287]],v=>{const m=v.P*v.V/(v.R*(v.t+273.15));return[['Mass',m,'kg'],['Density',m/v.V,'kg/m³']]}),
T('th','carnot','Carnot limits',[['Th','Hot reservoir (°C)',500],['Tc','Cold reservoir (°C)',25]],v=>{if(v.Th<=v.Tc)return'Hot reservoir must be warmer.';const H=v.Th+273.15,C=v.Tc+273.15;return[['Engine efficiency',(1-C/H)*100,'%'],['Refrigerator COP',C/(H-C),''],['Heat pump COP',H/(H-C),'']]}),
T('fl','pipe','Pipe friction loss (Haaland)',[['rho','Density (kg/m³)',1000],['mu','Viscosity (Pa·s)',.001],['Q','Flow (m³/h)',17.2],['D','Inner diameter (mm)',65],['L','Length (m)',100],['e','Roughness (mm)',.045]],v=>{const V=v.Q/3600/(Math.PI*(v.D/1e3)**2/4),Re=v.rho*V*v.D/1e3/v.mu,f=Re<2300?64/Re:(-1.8*Math.log10((v.e/v.D/3.7)**1.11+6.9/Re))**-2,dP=f*v.L/(v.D/1e3)*v.rho*V*V/2;return[['Velocity',V,'m/s'],['Reynolds',Re,Re<2300?'laminar':'turbulent'],['Friction factor',f,''],['Pressure drop',dP/1e3,'kPa'],['Head loss',dP/(v.rho*9.81),'m']]}),
T('fl','pump','Pump power',[['Q','Flow (m³/h)',17.2],['H','Head (m)',15],['eta','Efficiency (%)',70],['rho','Density (kg/m³)',1000]],v=>{const hy=v.rho*9.81*v.Q/3600*v.H/1e3;return v.eta<=0||v.eta>100?'Efficiency must be 1 to 100.':[['Hydraulic power',hy,'kW'],['Shaft power',hy/(v.eta/100),'kW']]}),
T('st','beam','Simply supported beam',[['L','Span (m)',4],['P','Midspan load (kN)',10],['w','Uniform load (kN/m)',5],['E','E (GPa)',200],['I','I (cm⁴)',8000]],v=>{const EI=v.E*v.I*10;return[['Reaction each support',(v.P+v.w*v.L)/2,'kN'],['Maximum moment',v.P*v.L/4+v.w*v.L**2/8,'kN·m'],['Maximum deflection',(v.P*1e3*v.L**3/(48*EI)+5*v.w*1e3*v.L**4/(384*EI))*1e3,'mm']]}),
T('dy','vib','Spring-mass vibration',[['m','Mass (kg)',50],['k','Stiffness (N/m)',20000],['c','Damping (N·s/m)',200]],v=>{const w=Math.sqrt(v.k/v.m);return[['Natural frequency',w/(2*Math.PI),'Hz'],['Angular frequency',w,'rad/s'],['Damping ratio',v.c/(2*Math.sqrt(v.k*v.m)),'']]}),
T('dy','torq','Torque from power and speed',[['P','Power (kW)',15],['n','Speed (rpm)',1450]],v=>[['Torque',v.P*9549.3/v.n,'N·m'],['Angular speed',2*Math.PI*v.n/60,'rad/s']]),
T('ma','stress','Axial stress and safety factor',[['F','Force (kN)',50],['A','Area (mm²)',400],['Sy','Yield strength (MPa)',250],['E','E (GPa)',200]],v=>{const s=v.F*1e3/v.A;return[['Stress',s,'MPa'],['Safety factor',v.Sy/s,''],['Strain',s/(v.E*1e3)*1e6,'µε']]}),
T('ma','euler','Euler buckling load',[['E','E (GPa)',200],['I','I (cm⁴)',50],['L','Length (m)',2],['K','End factor K',1]],v=>[['Critical load',Math.PI**2*v.E*v.I*10/(v.K*v.L)**2/1e3,'kN']]),
T('md','shaft','Shaft diameter from torque',[['T','Torque (N·m)',100],['tau','Allowable shear (MPa)',40]],v=>[['Minimum diameter',Math.cbrt(16*v.T*1e3/(Math.PI*v.tau)),'mm']])];
function card(c){const[,id,t,ins]=c;return`<article class="card"><h3>${t}</h3><div class="f">${ins.map(([k,l,d])=>`<label>${l}<input id="${id}_${k}" type="number" step="any" value="${d}"></label>`).join('')}</div><button class="b" onclick="run('${id}')">Calculate</button><div class="res" id="r_${id}"></div></article>`}
function run(id){const c=K.find(x=>x[1]===id),v={},box=$('#r_'+id);let r;c[3].forEach(([k])=>v[k]=parseFloat($('#'+id+'_'+k).value));
if(Object.values(v).some(x=>!isFinite(x)))r='Enter a valid number in every field.';else try{r=c[4](v)}catch(e){r='Check your inputs.'}
if(typeof r==='string'||r.some(x=>typeof x[1]==='number'&&!isFinite(x[1]))){box.className='res err';box.textContent=typeof r==='string'?r:'The inputs give no finite result. Check them.';return}
LAST[id]={title:c[2],inputs:c[3].map(([k,l])=>l+': '+v[k]).join('; '),out:r.map(x=>x[0]+' = '+N(x[1])+' '+x[2]).join('; ')};
box.className='res ok';box.innerHTML=r.map(x=>`<div><span>${x[0]}</span><b>${N(x[1])} ${x[2]}</b></div>`).join('')+`<button class="b s" onclick="saveCalc('${id}')">Save to project</button>`}
function newProj(n,c=''){const p={id:uid(),owner:owner(),name:n,client:c,calcs:[]};S.projects.push(p);S.active[owner()]=p.id;save();return p}
function saveCalc(id){if(!mine().length){const n=prompt('Name your first project:');if(!n)return;newProj(n)}const p=mine().find(x=>x.id===S.active[owner()])||mine()[0];p.calcs.push({...LAST[id],date:new Date().toLocaleString()});save();head();toast('Saved to '+p.name)}
function calcPage(a){return`<div class="ph"><h2>${CAT[a][0]}</h2><p>${CAT[a][1]}.</p></div><div class="g">${K.filter(c=>c[0]===a).map(card).join('')}</div><div class="note">These tools give preliminary results. Confirm final designs against applicable codes, material data and a qualified engineer’s review.</div>`}
function home(){return`<section class="sheet"><div class="l"><h1>Calculate it. Save it. Hand off the drawing.</h1><p>One workspace for mechanical engineering: calculators across every core discipline, saved project records, and a marketplace where companies hire verified freelancers for CAD and analysis.</p><p><a class="b" href="#/calc/ht">Open calculators</a> <a class="b s" href="#/market">Hire or find work</a></p></div><div class="tb"><div><span>Disciplines</span>${Object.keys(CAT).length}</div><div><span>Calculators</span>${K.length}</div><div><span>CAD tools</span>SolidWorks, CATIA, AutoCAD</div><div><span>Platform fee</span>20%</div><div><span>Freelancer share</span>80%</div></div></section><div class="g">${Object.entries(CAT).map(([k,v])=>`<a class="card cat" href="#/calc/${k}"><h3>${v[0]}</h3><p>${v[1]}</p></a>`).join('')}</div>`}
function projects(){const ps=mine();return`<div class="ph"><h2>Project workspace</h2><p>${S.session?'Projects are saved to your account on this browser.':'You are working as a guest. Sign in under Marketplace to keep projects under your account.'}</p></div><div class="card"><h3>New project</h3><div class="f"><label>Project name<input id="pn"></label><label>Client or site<input id="pc"></label></div><button class="b" onclick="addProj()">Create project</button></div>`+(ps.length?ps.map(p=>`<div class="card"><div class="row"><h3>${esc(p.name)}</h3><span class="mut">${esc(p.client)} ${p.id===S.active[owner()]?'(active)':''}</span></div><table>${p.calcs.map((c,i)=>`<tr><td><b>${esc(c.title)}</b><br><span class="mut">${esc(c.inputs)}</span></td><td>${esc(c.out)}</td><td><button class="b x" onclick="delCalc('${p.id}',${i})">Remove</button></td></tr>`).join('')||'<tr><td class="mut">No calculations yet. Calculate something, then choose Save to project.</td></tr>'}</table><div class="row" style="margin-top:12px"><span><button class="b s" onclick="setActive('${p.id}')">Make active</button> <button class="b s" onclick="exportProj('${p.id}')">Export report</button></span><button class="b x" onclick="delProj('${p.id}')">Delete project</button></div></div>`).join(''):'<div class="card mut">No projects yet. Create one above.</div>')}
function addProj(){const n=$('#pn').value.trim();if(!n)return toast('Enter a project name');newProj(n,$('#pc').value.trim());route()}
function setActive(id){S.active[owner()]=id;save();route()}
function delCalc(p,i){S.projects.find(x=>x.id===p).calcs.splice(i,1);save();route()}
function delProj(id){if(confirm('Delete this project and its calculations?')){S.projects=S.projects.filter(p=>p.id!==id);save();route()}}
function exportProj(id){const p=S.projects.find(x=>x.id===id),t=['MECHMIND AI PROJECT REPORT','Project: '+p.name,'Client: '+p.client,'Date: '+new Date().toLocaleString(),'',...p.calcs.map((c,i)=>(i+1)+'. '+c.title+'\n   Inputs: '+c.inputs+'\n   Results: '+c.out+'\n   Saved: '+c.date),'','Preliminary calculations only. Verify against codes and standards.'].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=p.name.replace(/\W+/g,'_')+'_report.txt';a.click();URL.revokeObjectURL(a.href)}
const JC=['SolidWorks 3D modeling','CATIA surface and assembly design','AutoCAD 2D drafting','Fusion 360 or Inventor design','FEA or CFD analysis','HVAC system design','Thermal or fluid calculations','Stress and machine design','Technical report','Other'];
const DS=[['SolidWorks','Parts, assemblies, drawings, sheet metal and weldments.',0],['CATIA','Surface modeling, large assemblies and digital mock-up.',1],['AutoCAD','2D drafting, HVAC and piping layouts, plans and details.',2],['Fusion 360 and Inventor','Parametric design, CAM and rapid prototyping.',3],['FEA and CFD','Structural, thermal and flow simulation with a written report.',4],['HVAC design','Load calculation, duct and pipe layouts, equipment schedules.',5]];
function design(){return`<div class="ph"><h2>Design studio</h2><p>Pick a service and post the job. Freelancers who know the tool will bid and deliver.</p></div><div class="g">${DS.map(d=>`<article class="card"><h3>${d[0]}</h3><p class="mut">${d[1]}</p><button class="b" onclick="startJob(${d[2]})">Request this service</button></article>`).join('')}</div>`}
function startJob(i){preset=i;location.hash='#/market'}
async function signup(){const n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value;if(!n||!/.+@.+/.test(e)||p.length<6)return toast('Complete every field; password needs 6+ characters');if(S.users.some(u=>u.email===e))return toast('That email is already registered');const u={id:uid(),name:n,email:e,pw:await hash(p),role:$('#ar').value};S.users.push(u);S.session=u.id;save();route()}
async function login(){const e=$('#le').value.trim().toLowerCase(),u=S.users.find(x=>x.email===e);if(!u||u.pw!==await hash($('#lp').value))return toast('Email or password is incorrect');S.session=u.id;save();route()}
function logout(){S.session=null;save();route()}
const jb=id=>S.jobs.find(j=>j.id===id);
function postJob(){const t=$('#jt').value.trim(),b=parseFloat($('#jb').value),d=$('#jd').value.trim();if(!t||!(b>0)||!d)return toast('Add a title, description and a budget above 0');S.jobs.unshift({id:uid(),by:S.session,byName:me().name,title:t,cat:$('#jc').value,desc:d,budget:b,days:+$('#jx').value||7,status:'open',worker:null,workerName:'',delivery:'',date:new Date().toLocaleDateString()});save();toast('Job posted');route()}
function acceptJob(id){const j=jb(id);if(j&&j.status==='open'){j.status='progress';j.worker=S.session;j.workerName=me().name;save();route()}}
function deliver(id){const t=$('#d_'+id).value.trim();if(!t)return toast('Add a delivery link or note');const j=jb(id);j.delivery=t;j.status='delivered';save();route()}
function approve(id){jb(id).status='done';save();route()}
function jobCard(j){const u=me(),f=j.budget*FEE,st={open:'Open',progress:'In progress',delivered:'Delivered',done:'Completed'}[j.status];let a='';
if(u&&u.role==='freelancer'){if(j.status==='open')a=`<button class="b" onclick="acceptJob('${j.id}')">Take this job</button>`;else if(j.worker===u.id&&j.status==='progress')a=`<input id="d_${j.id}" placeholder="Delivery link or notes" style="max-width:300px"><button class="b" onclick="deliver('${j.id}')">Submit delivery</button>`}
if(u&&u.id===j.by&&j.status==='delivered')a=`<button class="b" onclick="approve('${j.id}')">Approve and release payment</button>`;
return`<article class="card"><div class="row"><h3>${esc(j.title)}</h3><span class="tag ${j.status}">${st}</span></div><p class="mut">${esc(j.cat)}, ${j.days} days, posted by ${esc(j.byName)} on ${esc(j.date)}</p><p>${esc(j.desc)}</p><div class="split"><span>Budget <b>${$m(j.budget)}</b></span><span>Freelancer gets 80% <b>${$m(j.budget-f)}</b></span><span>Platform fee 20% <b>${$m(f)}</b></span></div>${j.delivery&&u&&(u.id===j.by||u.id===j.worker)?`<p><b>Delivery:</b> ${esc(j.delivery)}</p>`:''}${j.status==='done'?'<p class="mut">Payout is queued. The payment gateway is not connected yet.</p>':''}<div class="row">${a}</div></article>`}
function market(){const u=me();let h=`<div class="ph"><h2>Marketplace</h2><p>Companies post engineering work. Freelancers take it, deliver it and get paid 80% of the budget.</p></div>`;
if(!u)h+=`<div class="g"><div class="card"><h3>Sign in</h3><div class="f"><label>Email<input id="le" type="email"></label><label>Password<input id="lp" type="password"></label></div><button class="b" onclick="login()">Sign in</button></div><div class="card"><h3>Create an account</h3><div class="f"><label>Name or company<input id="an"></label><label>I am a<select id="ar"><option value="company">Company posting work</option><option value="freelancer">Freelance engineer</option></select></label><label>Email<input id="ae" type="email"></label><label>Password<input id="ap" type="password"></label></div><button class="b" onclick="signup()">Create account</button></div></div><h3 style="margin:20px 0 10px">Open jobs</h3>`;
else{h+=`<div class="card row"><span>Signed in as <b>${esc(u.name)}</b> (${u.role})</span><button class="b s" onclick="logout()">Sign out</button></div>`;
if(u.role==='company')h+=`<div class="card"><h3>Post a job</h3><div class="f"><label>Title<input id="jt"></label><label>Service<select id="jc">${JC.map((c,i)=>`<option${i===preset?' selected':''}>${c}</option>`).join('')}</select></label><label>Budget (USD)<input id="jb" type="number" min="1" step="any"></label><label>Deadline (days)<input id="jx" type="number" min="1" value="7"></label><label style="grid-column:1/-1">What do you need?<textarea id="jd" rows="3"></textarea></label></div><button class="b" onclick="postJob()">Post job</button><p class="mut">The freelancer receives 80% of the budget and the platform keeps 20%.</p></div><h3 style="margin:20px 0 10px">Your jobs</h3>`;else h+=`<h3 style="margin:20px 0 10px">Open jobs and your work</h3>`}
const list=S.jobs.filter(j=>!u?j.status==='open':u.role==='company'?j.by===u.id:j.status==='open'||j.worker===u.id);
return h+(list.length?`<div class="g">${list.map(jobCard).join('')}</div>`:'<div class="card mut">No jobs here yet.</div>')+`<div class="note">Accounts, jobs and payouts are stored in this browser for now. Connect a backend and a payment gateway before real money moves.</div>`}
function head(){const p=mine().find(x=>x.id===S.active[owner()]),u=me();$('#proj').textContent=p?'Active project: '+p.name+' ('+p.calcs.length+' saved)':'No active project';$('#user').innerHTML=u?esc(u.name)+' ('+u.role+')':'<a href="#/market">Sign in</a>'}
function route(){const h=(location.hash||'#/home').slice(2).split('/'),pg=h[0],a=CAT[h[1]]?h[1]:'ht';$('#app').innerHTML=pg==='calc'?calcPage(a):({home,projects,design,market}[pg]||home)();const cur='#/'+(pg==='calc'?'calc/'+a:pg);document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.getAttribute('href')===cur));head();scrollTo(0,0)}
$('#nav').innerHTML=[['home','Home'],['projects','Project workspace'],['design','Design studio'],['market','Marketplace']].map(x=>`<a class="nb" href="#/${x[0]}">${x[1]}</a>`).join('')+'<div class="lab">Engineering calculators</div>'+Object.entries(CAT).map(([k,v])=>`<a class="nb" href="#/calc/${k}">${v[0]}</a>`).join('');
addEventListener('hashchange',route);route();
</script></body></html>
